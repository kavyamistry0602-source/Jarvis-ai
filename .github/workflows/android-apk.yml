name: Build JARVIS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Web UI
        run: npm run build -- --webpack

      - name: Copy Web UI into Android assets
        run: |
          mkdir -p android/app/src/main/assets/web
          rm -rf android/app/src/main/assets/web/*
          cp -r out/* android/app/src/main/assets/web/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-29" "build-tools;34.0.0"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
