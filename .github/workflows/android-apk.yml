name: Build JARVIS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Web UI
        run: npm run build -- --webpack

      - name: Verify static export
        run: |
          echo "Checking Next.js build output..."
          ls -la
          echo "Searching for generated index.html..."
          find . -maxdepth 4 -type f -name "index.html" -print
          echo "Checking out directory..."
          if [ -f out/index.html ]; then
            echo "Static export OK"
          else
            echo "ERROR: out/index.html was not generated"
            echo "Next.js config:"
            cat next.config.ts
            echo "Build directory:"
            ls -la .next
            exit 1
          fi

      - name: Copy Web UI into Android assets
        run: |
          mkdir -p android/app/src/main/assets/web
          rm -rf android/app/src/main/assets/web/*
          cp -r out/. android/app/src/main/assets/web/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-29" "build-tools;34.0.0"

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
